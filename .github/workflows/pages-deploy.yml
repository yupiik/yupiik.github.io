# Static deployment: uploads files already checked in under public/, no build/generator.
name: Deploy static Yupiik OSS site
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - '.github/workflows/pages-deploy.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v6
      - name: Upload hand-maintained static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
